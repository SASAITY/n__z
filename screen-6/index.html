      :root {
        --frame-width: 430px;
        --frame-height: 932px;
        --grid-margin: 25px;
        --font-family: "IBM Plex Mono", monospace;
        --ink: #272727;
        --line: #8f8f8f;
        --soft-line: rgba(39, 39, 39, 0.24);
        --paper: #ffffff;
        --app-scale: 1;
        --canvas-scale: 1;
        --canvas-x: 0px;
        --canvas-y: 0px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111111;
        color: var(--ink);
        font-family: var(--font-family);
        letter-spacing: 0;
      }

      body {
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }

      .phone {
        position: relative;
        width: var(--frame-width);
        height: var(--frame-height);
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        border-radius: 0;
        transform: scale(var(--app-scale));
        transform-origin: top center;
      }

      .phone::before {
        content: "";
        position: absolute;
        top: 0;
        left: 121px;
        z-index: 12;
        width: 188px;
        height: 106px;
        border-radius: 0 0 24px 24px;
        background: #111111;
      }

      .screen {
        position: absolute;
        inset: 0;
        width: var(--frame-width);
        height: var(--frame-height);
        overflow: hidden;
        background: var(--paper);
      }

      .island-title {
        position: absolute;
        top: 57px;
        left: 121px;
        z-index: 13;
        display: grid;
        place-items: center;
        width: 188px;
        height: 36px;
        color: #ffffff;
        font-size: 24px;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;
        text-transform: uppercase;
      }

      .profile {
        position: absolute;
        left: 34px;
        bottom: 10px;
        width: 52px;
        height: 52px;
        text-decoration: none;
      }

      .profile img {
        display: block;
        width: 52px;
        height: 52px;
        object-fit: contain;
      }

      .object-stage {
        position: absolute;
        left: 0;
        top: 174px;
        width: var(--frame-width);
        height: 552px;
        touch-action: none;
        transform: translate3d(var(--canvas-x), var(--canvas-y), 0) scale(var(--canvas-scale));
        transform-origin: center 268px;
      }

      .pulse {
        position: absolute;
        left: 50%;
        top: 268px;
        width: 420px;
        height: 420px;
        border: 0.5px solid rgba(39, 39, 39, 0.14);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        animation: pulse 8s ease-in-out infinite;
      }

      .pulse:nth-child(1) {
        animation-delay: 0s;
      }

      .pulse:nth-child(2) {
        width: 468px;
        height: 468px;
        animation-delay: -1.6s;
      }

      .pulse:nth-child(3) {
        width: 516px;
        height: 516px;
        animation-delay: -3.2s;
      }

      .pulse:nth-child(4) {
        width: 564px;
        height: 564px;
        animation-delay: -4.8s;
      }

      .main-object {
        position: absolute;
        left: 5px;
        top: 58px;
        width: 420px;
        height: 420px;
        border: 0.75px solid var(--ink);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.58);
        animation: object-breath 6s ease-in-out infinite;
      }

      .main-object.is-tapped {
        animation: object-tap 420ms ease-out, object-breath 6s ease-in-out 420ms infinite;
      }

      .main-object.is-voice-active {
        animation: object-voice 780ms ease-in-out infinite;
      }

      .object-stage.is-tapped .pulse {
        animation: pulse-tap 520ms ease-out;
      }

      .bubble {
        position: absolute;
        display: grid;
        place-items: center;
        overflow: visible;
        border: 0.5px solid var(--ink);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.42);
        color: var(--ink);

        font-weight: 500;
        line-height: 1.08;
        text-align: center;
        text-transform: uppercase;
        will-change: transform;
        transform: translate3d(0, 0, 0);
        transition:
          left 640ms ease,
          top 640ms ease,
          width 640ms ease,
          height 640ms ease,
          opacity 360ms ease,
          border-color 360ms ease;

    <script>
      let zoomMode = null;
      let activeMicroParent = null;
      let activeNanoParent = null;
      let voiceActive = false;
      const canvasState = {
        scale: 1,
        x: 0,
        y: 0,
        pinchDistance: 0,
        startScale: 1,
      };

      function setAppScale() {
        const scale = Math.min(1, window.innerWidth / 430, window.innerHeight / 932);
        document.documentElement.style.setProperty("--app-scale", scale.toString());
      }

      function setCanvasTransform(scale, x = canvasState.x, y = canvasState.y) {
        canvasState.scale = Math.min(2.6, Math.max(1, scale));
        canvasState.x = x;
        canvasState.y = y;

        if (canvasState.scale === 1) {
          canvasState.x = 0;
          canvasState.y = 0;
        }

        document.documentElement.style.setProperty("--canvas-scale", canvasState.scale.toString());
        document.documentElement.style.setProperty("--canvas-x", `${canvasState.x}px`);
        document.documentElement.style.setProperty("--canvas-y", `${canvasState.y}px`);
      }

      function resetOverview() {
        zoomMode = null;
        activeMicroParent = null;
        activeNanoParent = null;
        setCanvasTransform(1, 0, 0);
        document
          .querySelector(".main-object")
          ?.classList.remove(
            "is-zoomed-music",
            "is-zoomed-digital",
            "is-zoomed-ads",
            "is-zoomed-animation",
            "is-zoomed-digital-small",
            "is-zoomed-branding",
            "is-zoomed-cinema",
            "is-zoomed-ai",
            "is-zoomed-architecture",
            "is-zoomed-events",
          );
        document.querySelectorAll(".bubble.has-micro-open").forEach((bubble) => {
          bubble.classList.remove("has-micro-open");
        });
        document.querySelectorAll(".child-bubble.is-micro-open").forEach((bubble) => {
          bubble.classList.remove("is-micro-open");
        });
        document.querySelectorAll(".child-bubble.has-nano-open").forEach((bubble) => {
          bubble.classList.remove("has-nano-open");
        });
        document.querySelectorAll(".micro-bubble.is-nano-open").forEach((bubble) => {
          bubble.classList.remove("is-nano-open");
        });
      }

      function zoomToSection(section) {
        const mainObject = document.querySelector(".main-object");
        if (!mainObject || zoomMode === section) return;

        resetOverview();
        zoomMode = section;
        document.querySelectorAll(".bubble").forEach((bubble) => {
          bubble.style.transform = "translate3d(0, 0, 0)";
        });
        mainObject.classList.add(`is-zoomed-${section}`);
      }

      function emitBubbleWave(bubble) {
        const stage = document.querySelector(".object-stage");
        if (!stage || !bubble) return;

        const stageRect = stage.getBoundingClientRect();
        const bubbleRect = bubble.getBoundingClientRect();
        const wave = document.createElement("span");
        const scale = canvasState.scale || 1;
        wave.className = "bubble-response-wave";
        wave.style.left = `${(bubbleRect.left - stageRect.left + bubbleRect.width / 2) / scale}px`;
        wave.style.top = `${(bubbleRect.top - stageRect.top + bubbleRect.height / 2) / scale}px`;
        wave.style.width = `${Math.max(44, bubbleRect.width / scale)}px`;
        wave.style.height = `${Math.max(44, bubbleRect.height / scale)}px`;

        stage.append(wave);
        window.setTimeout(() => wave.remove(), 1300);
      }

      function handleSectionClick(event, section) {
        event.stopPropagation();
        emitBubbleWave(event.currentTarget);

        if (zoomMode === section && !event.target.closest(".child-bubble")) {
          resetOverview();
          return;
        }

        zoomToSection(section);
      }

      function closeMicroZoom() {
        closeNanoZoom();
        activeMicroParent = null;
        document.querySelectorAll(".bubble.has-micro-open").forEach((bubble) => {
          bubble.classList.remove("has-micro-open");
        });
        document.querySelectorAll(".child-bubble.is-micro-open").forEach((bubble) => {
          bubble.classList.remove("is-micro-open");
        });
      }

      function openMicroZoom(childBubble) {
        const parent = childBubble.closest(".bubble");
        if (!parent) return;

        closeMicroZoom();
        activeMicroParent = childBubble;
        parent.classList.add("has-micro-open");
        childBubble.classList.add("is-micro-open");
        requestAnimationFrame(() => positionMicroBubbles(childBubble));
      }

      function closeNanoZoom() {
        activeNanoParent = null;
        document.querySelectorAll(".child-bubble.has-nano-open").forEach((bubble) => {
          bubble.classList.remove("has-nano-open");
        });
        document.querySelectorAll(".micro-bubble.is-nano-open").forEach((bubble) => {
          bubble.classList.remove("is-nano-open");
        });
      }

      function openNanoZoom(microBubble) {
        const parent = microBubble.closest(".child-bubble");
        if (!parent) return;

        closeNanoZoom();
        activeNanoParent = microBubble;
        parent.classList.add("has-nano-open");
        microBubble.classList.add("is-nano-open");
        requestAnimationFrame(() => positionNanoBubbles(microBubble));
      }

        document.querySelectorAll(".child-bubble").forEach((child, index) => {
          if (child.querySelector(".micro-bubbles")) return;

          const title = child.textContent.trim().replace(/\s+/g, " ");
          const titleWrap = document.createElement("span");
          titleWrap.className = "child-title";
          titleWrap.innerHTML = child.innerHTML;
          child.replaceChildren(titleWrap);

          const microLayer = document.createElement("span");
          microLayer.className = "micro-bubbles";
          const count = 6 + ((title.length + index * 3) % 8);

          for (let i = 0; i < count; i += 1) {
            const micro = document.createElement("span");
            micro.className = "micro-bubble";
            const microTitle = document.createElement("span");
            microTitle.className = "micro-title";
            microTitle.textContent = namePool[(title.length + index * 2 + i * 5) % namePool.length];
            micro.append(microTitle);

            const nanoLayer = document.createElement("span");
            nanoLayer.className = "nano-bubbles";
            const nanoCount = 5 + ((title.length + index * 2 + i * 3) % 6);
            for (let nanoIndex = 0; nanoIndex < nanoCount; nanoIndex += 1) {

            }

            micro.append(nanoLayer);
            microLayer.append(micro);
          }

          child.append(microLayer);
        });
      }

      function positionMicroBubbles(parent) {
        const parentSize = parent.offsetWidth || 220;
        const center = parentSize / 2;
        const items = [...parent.querySelectorAll(".micro-bubble")];

        items.forEach((node, index) => {
          const size = Math.min(78, Math.max(56, parentSize * (0.23 + ((index % 4) * 0.025))));
          const radius = size / 2;
          const angle = index * 2.34 + items.length * 0.37;
          const ring = parentSize * (0.24 + ((index % 3) * 0.065));
          const x = center + Math.cos(angle) * ring - radius;
          const y = center + Math.sin(angle) * ring - radius;

          node.style.width = `${size}px`;
          node.style.height = `${size}px`;
          node.style.left = `${x}px`;
          node.style.top = `${y}px`;
          node.style.transform = "translate3d(0, 0, 0)";
          node.dataset.baseX = x.toString();
          node.dataset.baseY = y.toString();
          node.dataset.radius = radius.toString();
          node.dataset.x = x.toString();
          node.dataset.y = y.toString();
        });
      }

      function positionNanoBubbles(parent) {
        const parentSize = parent.offsetWidth || 196;
        const center = parentSize / 2;
        const items = [...parent.querySelectorAll(".nano-bubble")];

        items.forEach((node, index) => {
          const size = Math.min(54, Math.max(34, parentSize * (0.18 + ((index % 4) * 0.018))));
          const radius = size / 2;
          const angle = index * 2.28 + items.length * 0.49;
          const ring = parentSize * (0.22 + ((index % 3) * 0.075));
          const x = center + Math.cos(angle) * ring - radius;
          const y = center + Math.sin(angle) * ring - radius;

          node.style.width = `${size}px`;
          node.style.height = `${size}px`;
          node.style.left = `${x}px`;
          node.style.top = `${y}px`;
          node.style.transform = "translate3d(0, 0, 0)";
          node.dataset.baseX = x.toString();
          node.dataset.baseY = y.toString();
          node.dataset.radius = radius.toString();
          node.dataset.x = x.toString();
          node.dataset.y = y.toString();
        });
      }

      function constrainToCircle(item, center, radius, padding = 6) {
        const cx = item.x + item.r;
        const cy = item.y + item.r;
        const dx = cx - center.x;
        const dy = cy - center.y;
        const distance = Math.hypot(dx, dy) || 1;
        const maxDistance = radius - item.r - padding;

        if (distance <= maxDistance) return;

        const nx = dx / distance;
        const ny = dy / distance;
        item.x = center.x + nx * maxDistance - item.r;
        item.y = center.y + ny * maxDistance - item.r;

        const dot = item.vx * nx + item.vy * ny;
        if (dot > 0) {
          item.vx -= 1.9 * dot * nx;
          item.vy -= 1.9 * dot * ny;
        }
      }

      function avoidCenterLabel(item, center, radius) {
        const cx = item.x + item.r;
        const cy = item.y + item.r;
        const dx = cx - center.x;
        const dy = cy - center.y;
        const distance = Math.hypot(dx, dy) || 1;
        const minDistance = radius + item.r;

        if (distance >= minDistance) return;

        const nx = dx / distance;
        const ny = dy / distance;
        const push = (minDistance - distance) * 0.72;
        item.x += nx * push;
        item.y += ny * push;

        const dot = item.vx * nx + item.vy * ny;
        if (dot < 0) {
          item.vx -= 1.6 * dot * nx;
          item.vy -= 1.6 * dot * ny;
        }
      }

      function separateCircles(items, gap, strength, center, radius, padding) {
        for (let i = 0; i < items.length; i += 1) {
          for (let j = i + 1; j < items.length; j += 1) {
            const a = items[i];
            const b = items[j];
            const ax = a.x + a.r;
            const ay = a.y + a.r;
            const bx = b.x + b.r;
            const by = b.y + b.r;
            const dx = bx - ax;
            const dy = by - ay;
            const distance = Math.hypot(dx, dy) || 1;
            const minDistance = a.r + b.r + gap;

            if (distance < minDistance) {
              const nx = dx / distance;
              const ny = dy / distance;
              const push = (minDistance - distance) * strength;
              a.x -= nx * push;
              a.y -= ny * push;
              b.x += nx * push;
              b.y += ny * push;

              const avn = a.vx * nx + a.vy * ny;
              const bvn = b.vx * nx + b.vy * ny;
              const impulse = (avn - bvn) * 0.5;
              a.vx -= impulse * nx;
              a.vy -= impulse * ny;
              b.vx += impulse * nx;
              b.vy += impulse * ny;

              constrainToCircle(a, center, radius, padding);
              constrainToCircle(b, center, radius, padding);
            }
          }
        }
      }

      function startBubbleMotion() {
        const mainRadius = 210;
        const mainCenter = { x: 210, y: 210 };
        const bubbles = [...document.querySelectorAll(".bubble")].map((node, index) => {
          const size = node.offsetWidth;
          const baseX = node.offsetLeft;
          const baseY = node.offsetTop;
          const angle = index * 1.73;

          return {
            node,
            baseX,
            baseY,
            x: baseX,
            y: baseY,
            vx: Math.cos(angle) * 0.13,
            vy: Math.sin(angle) * 0.13,
            r: size / 2,
            voiceAngle: angle + 0.43,
            voicePhase: index * 0.71,
            voicePulse: 0,
          };
        });

        function tick() {
          if (zoomMode) {
            requestAnimationFrame(tick);
            return;
          }

          for (const bubble of bubbles) {
            const voiceBoost = voiceActive ? 2.8 : 1;
            if (voiceActive) {
              bubble.voicePulse += 0.06 + (bubble.r % 7) * 0.002;
              bubble.vx += Math.cos(bubble.voiceAngle + bubble.voicePulse + bubble.voicePhase) * 0.006;
              bubble.vy += Math.sin(bubble.voiceAngle * 1.17 + bubble.voicePulse + bubble.voicePhase) * 0.006;
            }
            bubble.x += bubble.vx * voiceBoost;
            bubble.y += bubble.vy * voiceBoost;
            constrainToCircle(bubble, mainCenter, mainRadius, 7);
          }

          separateCircles(bubbles, 12, 0.58, mainCenter, mainRadius, 7);

          for (const bubble of bubbles) {
            constrainToCircle(bubble, mainCenter, mainRadius, 7);
            bubble.vx *= voiceActive ? 0.992 : 0.997;
            bubble.vy *= voiceActive ? 0.992 : 0.997;

            const minimumMotion = voiceActive ? 0.22 : 0.09;
            const randomImpulse = voiceActive ? 0.09 : 0.035;

            if (Math.abs(bubble.vx) + Math.abs(bubble.vy) < minimumMotion) {
              bubble.vx += (Math.random() - 0.5) * randomImpulse;
              bubble.vy += (Math.random() - 0.5) * randomImpulse;
            }

            const dx = bubble.x - bubble.baseX;
            const dy = bubble.y - bubble.baseY;
            const voiceJitterX = voiceActive
              ? Math.cos(bubble.voicePulse * 2.3 + bubble.voicePhase) * (1.4 + bubble.r * 0.01)
              : 0;
            const voiceJitterY = voiceActive
              ? Math.sin(bubble.voicePulse * 1.9 + bubble.voicePhase) * (1.4 + bubble.r * 0.01)
              : 0;
            bubble.node.style.transform = `translate3d(${(dx + voiceJitterX).toFixed(2)}px, ${(dy + voiceJitterY).toFixed(2)}px, 0)`;
          }

          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
      }

      function startChildBubbleMotion() {
        const sectionRadius = 125;
        const sectionCenter = { x: 125, y: 125 };
        const children = [...document.querySelectorAll(".bubble .child-bubble")].map((node, index) => {
          const parent = node.closest(".bubble");
          const size = node.offsetWidth;
          const baseX = node.offsetLeft;
          const baseY = node.offsetTop;
          const angle = index * 1.91 + 0.7;

          return {
            node,
            parent,
            baseX,
            baseY,
            x: baseX,
            y: baseY,
            vx: Math.cos(angle) * 0.07,
            vy: Math.sin(angle) * 0.07,
            r: size / 2,
            voiceAngle: angle + 0.29,
            voicePhase: index * 0.83,
            voicePulse: 0,
          };
        });

        function tick() {
          const sectionSelector = {
            music: ".b-music",
            digital: ".b-digital",
            ads: ".b-ads",
            animation: ".b-animation",
            "digital-small": ".b-digital-small",
            branding: ".b-branding",
            cinema: ".b-cinema",
            ai: ".b-ai",
            architecture: ".b-architecture",
            events: ".b-events",
          }[zoomMode];
          const activeParent = sectionSelector ? document.querySelector(sectionSelector) : null;
          const activeChildren = activeParent
            ? children.filter((child) => child.parent === activeParent)
            : [];

          if (activeChildren.length) {
            for (const child of activeChildren) {
              const voiceBoost = voiceActive ? 3.2 : 1;
              if (voiceActive) {
                child.voicePulse += 0.075 + (child.r % 5) * 0.002;
                child.vx += Math.cos(child.voiceAngle + child.voicePulse + child.voicePhase) * 0.0048;
                child.vy += Math.sin(child.voiceAngle * 1.21 + child.voicePulse + child.voicePhase) * 0.0048;
              }
              child.x += child.vx * voiceBoost;
              child.y += child.vy * voiceBoost;
              constrainToCircle(child, sectionCenter, sectionRadius, 9);
              avoidCenterLabel(child, sectionCenter, 36);
              constrainToCircle(child, sectionCenter, sectionRadius, 9);
            }

            separateCircles(activeChildren, 8, 0.54, sectionCenter, sectionRadius, 9);

            for (const child of activeChildren) {
              constrainToCircle(child, sectionCenter, sectionRadius, 9);
              avoidCenterLabel(child, sectionCenter, 36);
              constrainToCircle(child, sectionCenter, sectionRadius, 9);
              child.vx *= voiceActive ? 0.992 : 0.998;
              child.vy *= voiceActive ? 0.992 : 0.998;

              const minimumMotion = voiceActive ? 0.18 : 0.045;
              const randomImpulse = voiceActive ? 0.07 : 0.024;

              if (Math.abs(child.vx) + Math.abs(child.vy) < minimumMotion) {
                child.vx += (Math.random() - 0.5) * randomImpulse;
                child.vy += (Math.random() - 0.5) * randomImpulse;
              }

              const dx = child.x - child.baseX;
              const dy = child.y - child.baseY;
              const voiceJitterX = voiceActive
                ? Math.cos(child.voicePulse * 2.1 + child.voicePhase) * (1.2 + child.r * 0.012)
                : 0;
              const voiceJitterY = voiceActive
                ? Math.sin(child.voicePulse * 1.7 + child.voicePhase) * (1.2 + child.r * 0.012)
                : 0;
              child.node.style.transform = `translate3d(${(dx + voiceJitterX).toFixed(2)}px, ${(dy + voiceJitterY).toFixed(2)}px, 0)`;
            }
          }

          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
      }

      function startMicroBubbleMotion() {
        const microItems = [...document.querySelectorAll(".micro-bubble")].map((node, index) => {
          const parent = node.closest(".child-bubble");
          const angle = index * 2.17;

          return {
            node,
            parent,
            baseX: Number(node.dataset.baseX || node.offsetLeft),
            baseY: Number(node.dataset.baseY || node.offsetTop),
            x: Number(node.dataset.x || node.offsetLeft),
            y: Number(node.dataset.y || node.offsetTop),
            vx: Math.cos(angle + 0.8) * 0.045,
            vy: Math.sin(angle + 0.8) * 0.045,
            r: Number(node.dataset.radius || node.offsetWidth / 2),
            voiceAngle: angle + 0.61,
            voicePhase: index * 0.97,
            voicePulse: 0,
          };
        });

        function tick() {
          const activeItems = activeMicroParent
            ? microItems.filter((item) => item.parent === activeMicroParent)
            : [];
          const parentSize = activeMicroParent?.offsetWidth || 200;
          const microCenter = { x: parentSize / 2, y: parentSize / 2 };
          const microRadius = parentSize / 2;

          if (activeItems.length) {
            for (const item of activeItems) {
              item.baseX = Number(item.node.dataset.baseX || item.baseX);
              item.baseY = Number(item.node.dataset.baseY || item.baseY);
              item.x = Number(item.node.dataset.x || item.x);
              item.y = Number(item.node.dataset.y || item.y);
              item.r = Number(item.node.dataset.radius || item.r);
              const voiceBoost = voiceActive ? 3.4 : 1;
              if (voiceActive) {
                item.voicePulse += 0.085 + (item.r % 4) * 0.002;
                item.vx += Math.cos(item.voiceAngle + item.voicePulse + item.voicePhase) * 0.0038;
                item.vy += Math.sin(item.voiceAngle * 1.31 + item.voicePulse + item.voicePhase) * 0.0038;
              }
              item.x += item.vx * voiceBoost;
              item.y += item.vy * voiceBoost;
              constrainToCircle(item, microCenter, microRadius, 6);
              avoidCenterLabel(item, microCenter, 28);
              constrainToCircle(item, microCenter, microRadius, 6);
            }

            separateCircles(activeItems, 5, 0.5, microCenter, microRadius, 6);

            for (const item of activeItems) {
              constrainToCircle(item, microCenter, microRadius, 6);
              avoidCenterLabel(item, microCenter, 28);
              constrainToCircle(item, microCenter, microRadius, 6);
              item.vx *= voiceActive ? 0.992 : 0.998;
              item.vy *= voiceActive ? 0.992 : 0.998;

              const minimumMotion = voiceActive ? 0.13 : 0.028;
              const randomImpulse = voiceActive ? 0.055 : 0.018;

              if (Math.abs(item.vx) + Math.abs(item.vy) < minimumMotion) {
                item.vx += (Math.random() - 0.5) * randomImpulse;
                item.vy += (Math.random() - 0.5) * randomImpulse;
              }

              const dx = item.x - item.baseX;
              const dy = item.y - item.baseY;
              const voiceJitterX = voiceActive
                ? Math.cos(item.voicePulse * 2.4 + item.voicePhase) * (1 + item.r * 0.013)
                : 0;
              const voiceJitterY = voiceActive
                ? Math.sin(item.voicePulse * 1.8 + item.voicePhase) * (1 + item.r * 0.013)
                : 0;
              item.node.style.transform = `translate3d(${(dx + voiceJitterX).toFixed(2)}px, ${(dy + voiceJitterY).toFixed(2)}px, 0)`;
              item.node.dataset.x = item.x.toString();
              item.node.dataset.y = item.y.toString();
            }
          }

          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
      }

      function startNanoBubbleMotion() {
        const nanoItems = [...document.querySelectorAll(".nano-bubble")].map((node, index) => {
          const parent = node.closest(".micro-bubble");
          const angle = index * 2.41 + 0.4;

          return {
            node,
            parent,
            baseX: Number(node.dataset.baseX || node.offsetLeft),
            baseY: Number(node.dataset.baseY || node.offsetTop),
            x: Number(node.dataset.x || node.offsetLeft),
            y: Number(node.dataset.y || node.offsetTop),
            vx: Math.cos(angle) * 0.035,
            vy: Math.sin(angle) * 0.035,
            r: Number(node.dataset.radius || node.offsetWidth / 2),
            voiceAngle: angle + 0.53,
            voicePhase: index * 1.13,
            voicePulse: 0,
          };
        });

        function tick() {
          const activeItems = activeNanoParent
            ? nanoItems.filter((item) => item.parent === activeNanoParent)
            : [];
          const parentSize = activeNanoParent?.offsetWidth || 196;
          const nanoCenter = { x: parentSize / 2, y: parentSize / 2 };
          const nanoRadius = parentSize / 2;

          if (activeItems.length) {
            for (const item of activeItems) {
              item.baseX = Number(item.node.dataset.baseX || item.baseX);
              item.baseY = Number(item.node.dataset.baseY || item.baseY);
              item.x = Number(item.node.dataset.x || item.x);
              item.y = Number(item.node.dataset.y || item.y);
              item.r = Number(item.node.dataset.radius || item.r);

              const voiceBoost = voiceActive ? 3.8 : 1;
              if (voiceActive) {
                item.voicePulse += 0.095 + (item.r % 3) * 0.002;
                item.vx += Math.cos(item.voiceAngle + item.voicePulse + item.voicePhase) * 0.0036;
                item.vy += Math.sin(item.voiceAngle * 1.37 + item.voicePulse + item.voicePhase) * 0.0036;
              }

              item.x += item.vx * voiceBoost;
              item.y += item.vy * voiceBoost;
              constrainToCircle(item, nanoCenter, nanoRadius, 5);
              avoidCenterLabel(item, nanoCenter, 27);
              constrainToCircle(item, nanoCenter, nanoRadius, 5);
            }

            separateCircles(activeItems, 4, 0.52, nanoCenter, nanoRadius, 5);

            for (const item of activeItems) {
              constrainToCircle(item, nanoCenter, nanoRadius, 5);
              avoidCenterLabel(item, nanoCenter, 27);
              constrainToCircle(item, nanoCenter, nanoRadius, 5);
              item.vx *= voiceActive ? 0.992 : 0.998;
              item.vy *= voiceActive ? 0.992 : 0.998;

              const minimumMotion = voiceActive ? 0.11 : 0.024;
              const randomImpulse = voiceActive ? 0.05 : 0.016;

              if (Math.abs(item.vx) + Math.abs(item.vy) < minimumMotion) {
                item.vx += (Math.random() - 0.5) * randomImpulse;
                item.vy += (Math.random() - 0.5) * randomImpulse;
              }

              const dx = item.x - item.baseX;
              const dy = item.y - item.baseY;
              const voiceJitterX = voiceActive
                ? Math.cos(item.voicePulse * 2.7 + item.voicePhase) * (0.8 + item.r * 0.012)
                : 0;
              const voiceJitterY = voiceActive
                ? Math.sin(item.voicePulse * 1.95 + item.voicePhase) * (0.8 + item.r * 0.012)
                : 0;
              item.node.style.transform = `translate3d(${(dx + voiceJitterX).toFixed(2)}px, ${(dy + voiceJitterY).toFixed(2)}px, 0)`;
              item.node.dataset.x = item.x.toString();
              item.node.dataset.y = item.y.toString();
            }
          }

          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
      }

      function startCanvasZoom() {
        const stage = document.querySelector(".object-stage");
        if (!stage) return;

        stage.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            const nextScale = canvasState.scale + (event.deltaY < 0 ? 0.12 : -0.12);
            setCanvasTransform(nextScale);
          },
          { passive: false },
        );

        stage.addEventListener(
          "touchstart",
          (event) => {
            if (event.touches.length !== 2) return;

            const [first, second] = event.touches;
            canvasState.pinchDistance = Math.hypot(first.clientX - second.clientX, first.clientY - second.clientY);
            canvasState.startScale = canvasState.scale;
          },
          { passive: false },
        );

        stage.addEventListener(
          "touchmove",
          (event) => {
            if (event.touches.length !== 2 || !canvasState.pinchDistance) return;

            event.preventDefault();
            const [first, second] = event.touches;
            const distance = Math.hypot(first.clientX - second.clientX, first.clientY - second.clientY);
            const nextScale = canvasState.startScale * (distance / canvasState.pinchDistance);
            setCanvasTransform(nextScale);
          },
          { passive: false },
        );

        stage.addEventListener("touchend", (event) => {
          if (event.touches.length < 2) {
            canvasState.pinchDistance = 0;
          }
        });
      }

      function startMicHoldFeedback() {
        const mic = document.querySelector(".mic");
        const recordingField = document.querySelector(".recording-field");
        const mainObject = document.querySelector(".main-object");
        const menuShade = document.querySelector(".menu-shade");
        if (!mic || !recordingField || !mainObject || !menuShade) return;
        let waveInterval = 0;
        let isRecording = false;

        function setVoiceClass(isActive) {
          const method = isActive ? "add" : "remove";
          mainObject.classList[method]("is-voice-active");
          menuShade.classList[method]("is-voice-active");
        }

        function emitVoiceWave() {
          const wave = document.createElement("span");
          wave.className = "recording-wave";
          recordingField.append(wave);
          window.setTimeout(() => wave.remove(), 6400);
        }

        function startRecordingVisual(event) {
          event?.preventDefault();
          if (isRecording) return;

          isRecording = true;
          voiceActive = true;
          setVoiceClass(true);
          emitVoiceWave();
          waveInterval = window.setInterval(emitVoiceWave, 460);
        }

        function stopRecordingVisual() {
          isRecording = false;
          voiceActive = false;
          setVoiceClass(false);
          window.clearInterval(waveInterval);
        }

        mic.addEventListener("pointerdown", startRecordingVisual);
        mic.addEventListener("pointerup", stopRecordingVisual);
        mic.addEventListener("pointercancel", stopRecordingVisual);
        mic.addEventListener("pointerleave", stopRecordingVisual);
        mic.addEventListener("click", (event) => {
          event.preventDefault();
        });
      }

      function pulseMainObject() {
        const mainObject = document.querySelector(".main-object");
        const stage = document.querySelector(".object-stage");
        if (!mainObject || !stage) return;

        mainObject.classList.remove("is-tapped");
        stage.classList.remove("is-tapped");
        void mainObject.offsetWidth;
        mainObject.classList.add("is-tapped");
        stage.classList.add("is-tapped");

        window.setTimeout(() => {
          mainObject.classList.remove("is-tapped");
          stage.classList.remove("is-tapped");
        }, 540);
      }

      setAppScale();
      generateMicroBubbles();
      startBubbleMotion();
      startChildBubbleMotion();
      startMicroBubbleMotion();
      startNanoBubbleMotion();
      startCanvasZoom();
      startMicHoldFeedback();
      window.addEventListener("resize", () => {
        if (document.activeElement?.matches?.("input, textarea, select")) return;
        setAppScale();
      });
      document.querySelector(".b-music")?.addEventListener("click", (event) => handleSectionClick(event, "music"));
      document.querySelector(".b-digital")?.addEventListener("click", (event) => handleSectionClick(event, "digital"));
      document.querySelector(".b-ads")?.addEventListener("click", (event) => handleSectionClick(event, "ads"));
      document.querySelector(".b-animation")?.addEventListener("click", (event) => handleSectionClick(event, "animation"));
      document
        .querySelector(".b-digital-small")
        ?.addEventListener("click", (event) => handleSectionClick(event, "digital-small"));
      document.querySelector(".b-branding")?.addEventListener("click", (event) => handleSectionClick(event, "branding"));
      document.querySelector(".b-cinema")?.addEventListener("click", (event) => handleSectionClick(event, "cinema"));
      document.querySelector(".b-ai")?.addEventListener("click", (event) => handleSectionClick(event, "ai"));
      document
        .querySelector(".b-architecture")
        ?.addEventListener("click", (event) => handleSectionClick(event, "architecture"));
      document.querySelector(".b-events")?.addEventListener("click", (event) => handleSectionClick(event, "events"));
      document.querySelectorAll(".child-bubble").forEach((child) => {
        child.addEventListener("click", (event) => {
          if (!zoomMode) return;
          event.stopPropagation();
          openMicroZoom(child);
        });
      });
      document.querySelectorAll(".micro-bubble").forEach((micro) => {
        micro.addEventListener("click", (event) => {
          if (!activeMicroParent) return;
          event.stopPropagation();
          openNanoZoom(micro);
        });
      });
      document.querySelector(".main-object")?.addEventListener("click", (event) => {
        if (activeNanoParent && !event.target.closest(".micro-bubble.is-nano-open")) {
          closeNanoZoom();
          return;
        }

        if (activeMicroParent && !event.target.closest(".child-bubble.is-micro-open")) {
          closeMicroZoom();
          return;
        }

        if (zoomMode && event.target.classList.contains("main-object")) {
          resetOverview();
          return;
        }

        if (!zoomMode && event.target.classList.contains("main-object")) {
          pulseMainObject();
        }
      });
    </script>
