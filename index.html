<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>НОВАЯ ЗАПИСЬ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@100;300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --frame-width: 430px;
        --frame-height: 932px;
        --grid-margin: 25px;
        --grid-gutter: 10px;
        --grid-column: 68px;
        --content-offset: 50px;
        --font-family: "IBM Plex Mono", monospace;
        --display-size: 99px;
        --lead-size: 16px;
        --body-size: 15px;
        --body-line-height: 1.08;
        --ink: #272727;
        --body-color: #999999;
        --paper: #ffffff;
        --content-width: calc(var(--frame-width) - (var(--grid-margin) * 2));
        --app-scale: 1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111111;
        color: var(--ink);
        font-family: var(--font-family);
        letter-spacing: 0;
      }

      body {
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }

      .phone {
        position: relative;
        width: var(--frame-width);
        height: var(--frame-height);
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        border-radius: 0;
        transform: scale(var(--app-scale));
        transform-origin: top center;
      }

      .phone::before {
        content: "";
        position: absolute;
        top: 0;
        left: 121px;
        z-index: 5;
        width: 188px;
        height: 35px;
        border-radius: 0 0 18px 18px;
        background: #111111;
      }

      .screen {
        position: absolute;
        inset: 0;
        width: var(--frame-width);
        height: var(--frame-height);
        overflow: hidden;
        background: var(--paper);
      }

      .brand {
        position: absolute;
        top: 53px;
        left: 50%;
        width: 178px;
        height: auto;
        display: block;
        transform: translateX(-50%);
      }

      .status-line {
        position: absolute;
        top: 81px;
        left: 50%;
        width: 149px;
        height: 15px;
        display: block;
        transform: translateX(-50%);
      }

      .lead {
        position: absolute;
        top: 186px;
        left: var(--grid-margin);
        width: var(--content-width);
        margin: 0;
        color: var(--ink);
        font-size: var(--lead-size);
        font-weight: 300;
        line-height: 0.89;
        text-align: left;
        white-space: nowrap;
      }

      .title {
        position: absolute;
        top: 207px;
        left: var(--grid-margin);
        width: var(--content-width);
        margin: 0;
        color: var(--ink);
        font-size: var(--display-size);
        font-weight: 600;
        line-height: 0.89;
        text-align: left;
        text-transform: uppercase;
      }

      .text-cursor {
        position: absolute;
        top: 429px;
        left: var(--grid-margin);
        width: 10px;
        height: 18px;
        display: block;
        animation: blink 1.1s steps(1, end) infinite;
      }

      @keyframes blink {
        0%,
        48% {
          opacity: 1;
        }

        49%,
        100% {
          opacity: 0.18;
        }
      }

      .description {
        position: absolute;
        top: 685px;
        left: var(--grid-margin);
        width: var(--content-width);
        margin: 0;
        color: var(--body-color);
        font-size: var(--body-size);
        font-weight: 100;
        line-height: var(--body-line-height);
        text-align: left;
      }

      .cta {
        position: absolute;
        top: 756px;
        left: var(--grid-margin);
        width: var(--content-width);
        height: 48px;
        display: block;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        cursor: pointer;
      }

      .cta img {
        width: var(--content-width);
        height: 48px;
        display: block;
      }

      .cta:focus-visible {
        outline: 1px solid var(--ink);
        outline-offset: 3px;
      }

      @media (min-width: 860px) and (min-height: 932px) {
        .phone {
          border-radius: 42px;
        }
      }

      img,
      button,
      a {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      img {
        -webkit-user-drag: none;
        user-drag: none;
        pointer-events: none;
      }

      input,
      textarea,
      select {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <main class="phone" aria-label="MVP Новая Запись">
      <div class="screen" aria-label="Первый экран">
        <a href="screen-6/index.html" aria-label="Открыть главный экран">
          <img class="brand" src="assets/g8-title.png" alt="G8 – TO – СЛОЙ" />
        </a>
        <img class="status-line" src="assets/status-line-screen-1.svg" alt="" />

        <p class="lead">искусство живого мнения</p>

        <h1 class="title">НОВАЯ<br />ЗАПИСЬ</h1>
        <img class="text-cursor" src="assets/text-cursor.png" alt="" />

        <p class="description">
          – цифровой арт объект, возникающий в реальном времени, посредством выражения человека о…
        </p>

        <a class="cta" href="next/index.html" aria-label="Далее">
          <img src="assets/button.png" alt="ДАЛЕЕ" />
        </a>
      </div>
    </main>
    <script>
      function setAppScale() {
        const scale = Math.min(1, window.innerWidth / 430, window.innerHeight / 932);
        document.documentElement.style.setProperty("--app-scale", scale.toString());
      }

      setAppScale();
      window.addEventListener("resize", () => {
        if (document.activeElement?.matches?.("input, textarea, select")) return;
        setAppScale();
      });
    </script>
  </body>
</html>
